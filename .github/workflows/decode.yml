name: decode
on:
  push:
    paths:
      - tofu.jpg.b64
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: decode and commit jpeg
        run: |
          set -euo pipefail
          base64 -d tofu.jpg.b64 > tofu.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tofu.jpg
          git commit -m "add tofu.jpg"
          git push
